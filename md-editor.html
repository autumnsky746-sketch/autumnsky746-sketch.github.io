<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 마크다운 편집기</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root {
    --ink: #111418;
    --ink-soft: #5b6b7a;
    --paper: #f4f6f8;
    --panel: #ffffff;
    --line: #dde3e9;
    --accent: #1a73e8;
    --accent-soft: #e8f0fe;
    --danger: #c5221f;
    --ok: #188038;
    --mono: ui-monospace, "Cascadia Code", "D2Coding", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* ── 상단 바 ─────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  header h1 span { color: var(--accent); }
  #fileTitle {
    font-size: 13px;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  #dirtyDot { color: var(--danger); font-weight: 700; display: none; }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--paper); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: #1765cc; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  /* ── 본문 레이아웃 ────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .side-head {
    padding: 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 6px;
  }
  #searchBox {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    background: var(--paper);
    color: var(--ink);
    min-width: 0;
  }
  #searchBox:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #fileList { flex: 1; overflow-y: auto; list-style: none; }
  #fileList li {
    padding: 9px 14px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 6px;
  }
  #fileList li:hover { background: var(--paper); }
  #fileList li.active { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 11px; }
  #fileList li .fname { font-weight: 400; word-break: break-all; }
  #fileList li .fdate { color: var(--ink-soft); font-size: 12px; margin-top: 3px; }
  .side-empty { padding: 20px 14px; color: var(--ink-soft); font-size: 13px; text-align: center; }

  .workspace { flex: 1; display: flex; min-width: 0; }
  #docArea { flex: 1; display: none; flex-direction: column; min-width: 0; background: var(--panel); }
  #docTitle { font-size: 27px; font-weight: 700; padding: 20px 24px 2px; letter-spacing: -0.3px; }
  #docTitle:empty { display: none; }
  #panes { flex: 1; display: flex; min-height: 0; min-width: 0; }
  #preview { touch-action: manipulation; }
  #editor {
    flex: 1;
    border: none;
    resize: none;
    padding: 20px;
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.75;
    color: var(--ink);
    background: var(--panel);
  }
  #editor:focus { outline: none; }
  #preview {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    background: var(--panel);
    display: none;
    line-height: 1.8;
    font-size: 16px;
  }
  #preview h1, #preview h2, #preview h3 { margin: 1.2em 0 0.5em; line-height: 1.35; }
  #preview h1 { font-size: 1.5em; }
  #preview hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
  #preview h2 { font-size: 1.25em; }
  #preview p, #preview ul, #preview ol { margin-bottom: 0.8em; }
  #preview ul, #preview ol { padding-left: 1.5em; }
  #preview code { background: #e8ecf0; padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 0.9em; }
  #preview pre { background: #1b2733; color: #e8ecf0; padding: 14px; border-radius: 8px; overflow-x: auto; margin-bottom: 0.8em; }
  #preview pre code { background: none; color: inherit; padding: 0; }
  #preview blockquote { border-left: 4px solid var(--accent); padding-left: 12px; color: var(--ink-soft); margin-bottom: 0.8em; }
  #preview table { border-collapse: collapse; margin-bottom: 0.8em; }
  #preview th, #preview td { border: 1px solid var(--line); padding: 6px 10px; }

  /* ── 로그인 화면 ─────────────────────── */
  #loginScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  #loginScreen .logo { font-size: 40px; }
  #loginScreen p { color: var(--ink-soft); font-size: 14px; max-width: 340px; line-height: 1.6; }

  /* ── 상태 바 / 토스트 ─────────────────── */
  footer {
    padding: 6px 16px;
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--panel);
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #fab {
    position: fixed;
    right: 18px;
    bottom: 58px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    display: none;
    cursor: pointer;
    z-index: 30;
  }
  #fab:active { transform: scale(0.96); }
  #toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    background: #242c34;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 99;
  }
  #toast.show { opacity: 1; }
  #toast.ok { background: var(--ok); }
  #toast.err { background: var(--danger); }

  /* ── 모바일 ──────────────────────────── */
  #backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 40;
  }
  #sideToggle { display: none; }
  @media (max-width: 720px) {
    #sideToggle { display: inline-block; }
    aside {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.2s;
      box-shadow: 4px 0 16px rgba(0,0,0,0.15);
      width: 80vw;
      max-width: 300px;
    }
    aside.open { transform: translateX(0); }
    #backdrop.show { display: block; }
    header h1 { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <button class="btn" id="sideToggle" aria-label="파일 목록 열기">☰</button>
  <h1>📄 마크다운 편집기</h1>
  <span id="fileTitle">파일을 선택하세요</span>
  <span id="dirtyDot" title="저장되지 않은 변경사항">●</span>
  <button class="btn" id="previewBtn" disabled>미리보기</button>
  <button class="btn btn-primary" id="saveBtn" disabled>저장</button>
  <button class="btn" id="delBtn" disabled>삭제</button>
  <button class="btn" id="authBtn">로그인</button>
</header>

<main>
  <div id="backdrop"></div>
  <aside id="sidebar">
    <div class="side-head">
      <input id="searchBox" type="text" placeholder="파일 이름 검색" disabled>
      <button class="btn" id="pinBtn" title="현재 폴더를 시작 폴더로 고정/해제" disabled>📌</button>
      <button class="btn" id="newBtn" title="새 md 파일 만들기" disabled>＋</button>
    </div>
    <ul id="fileList"></ul>
    <div class="side-empty" id="sideEmpty">로그인하면 드라이브의<br>.md 파일 목록이 표시됩니다</div>
  </aside>

  <div class="workspace">
    <div id="loginScreen">
      <div class="logo">📝</div>
      <p><strong>구글 드라이브 마크다운 편집기</strong></p>
      <p>구글 계정으로 로그인하면 드라이브에 있는 .md 파일을 열고, 편집하고, 바로 저장할 수 있습니다.</p>
      <button class="btn btn-primary" id="loginBigBtn">Google 계정으로 로그인</button>
    </div>
    <div id="docArea">
      <div id="docTitle"></div>
      <div id="panes">
        <textarea id="editor" spellcheck="false" placeholder="파일을 선택하면 여기서 편집합니다"></textarea>
        <div id="preview"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span id="statusMsg">로그아웃 상태</span>
  <span id="charCount"></span>
</footer>

<button id="fab" aria-label="미리보기로 전환">✓ 완료</button>

<div id="toast" role="status"></div>

<script>
/* ═══════════════════════════════════════════════════
   ★★★ 여기 두 줄만 본인 값으로 바꾸세요 ★★★
   ═══════════════════════════════════════════════════ */
const CLIENT_ID = "584511013290-3gvpdp663m2h9p82mu9gqc9m5l840ql2.apps.googleusercontent.com";
const API_KEY   = "AIzaSyDqB3pEy_tcECt7xq8tE-vPqLCBhFYsUcE";
/* ═══════════════════════════════════════════════════ */

const SCOPE = "https://www.googleapis.com/auth/drive";
const DRIVE = "https://www.googleapis.com/drive/v3";
const UPLOAD = "https://www.googleapis.com/upload/drive/v3";

let tokenClient = null;
let accessToken = null;
let currentFile = null;   // {id, name}
let dirty = false;
let allFiles = [];

const $ = id => document.getElementById(id);
const editor = $("editor");

/* ── 초기화 ─────────────────────────────── */
window.addEventListener("load", () => {
  const waitGIS = setInterval(() => {
    if (window.google && google.accounts) {
      clearInterval(waitGIS);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: onToken,
      });
    }
  }, 100);
});

function onToken(resp) {
  if (resp.error) { toast("로그인 실패: " + resp.error, "err"); return; }
  accessToken = resp.access_token;
  $("authBtn").textContent = "로그아웃";
  $("loginScreen").style.display = "none";
  $("docArea").style.display = "flex";
  setMode("edit");
  $("searchBox").disabled = false;
  $("newBtn").disabled = false;
  $("statusMsg").textContent = "로그인됨";
  buildIndex().then(() => {
    folderStack = (vaultRoot && idx.folders.has(vaultRoot.id))
      ? [vaultRoot]
      : [{ id: "root", name: "내 드라이브" }];
    $("pinBtn").disabled = false;
    loadFolder();
  }).catch(e => {
    if (e.message !== "token expired") { console.error(e); toast("드라이브 목록을 읽지 못했습니다", "err"); }
  });
}

function login() { tokenClient.requestAccessToken({ prompt: "" }); }

function logout() {
  if (dirty && !confirm("저장하지 않은 변경사항이 있습니다. 로그아웃할까요?")) return;
  if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null; currentFile = null; setDirty(false);
  allFiles = []; folderStack = [{ id: "root", name: "내 드라이브" }];
  idx.folders.clear(); idx.childFolders.clear(); idx.childFiles.clear(); idx.hasMd.clear(); idx.allMd = [];
  renderList([], true);
  editor.value = ""; editor.style.display = "none";
  $("preview").style.display = "none";
  $("docArea").style.display = "none";
  $("docTitle").textContent = "";
  $("loginScreen").style.display = "flex";
  $("authBtn").textContent = "로그인";
  $("fileTitle").textContent = "파일을 선택하세요";
  $("searchBox").disabled = true; $("newBtn").disabled = true; $("pinBtn").disabled = true;
  $("saveBtn").disabled = true; $("previewBtn").disabled = true; $("delBtn").disabled = true;
  $("sideEmpty").style.display = "block";
  $("statusMsg").textContent = "로그아웃 상태";
  $("charCount").textContent = "";
  toast("로그아웃했습니다. 공용 PC라면 브라우저 기록도 지워주세요.", "ok");
}

/* ── API 헬퍼 ───────────────────────────── */
async function api(url, opts = {}) {
  opts.headers = Object.assign({ Authorization: "Bearer " + accessToken }, opts.headers || {});
  const r = await fetch(url, opts);
  if (r.status === 401) {
    toast("세션이 만료되었습니다. 다시 로그인해주세요.", "err");
    accessToken = null;
    tokenClient.requestAccessToken({ prompt: "" });
    throw new Error("token expired");
  }
  if (!r.ok) throw new Error("API 오류 " + r.status + ": " + await r.text());
  return r;
}

/* ── 드라이브 인덱스 (전체 폴더 + md 목록을 한 번에) ── */
let folderStack = [{ id: "root", name: "내 드라이브" }];
let vaultRoot = null;             // {id, name} — 고정된 시작 폴더
try { vaultRoot = JSON.parse(localStorage.getItem("vaultRoot") || "null"); } catch (e) {}
let rootId = "root";
const idx = { folders: new Map(), childFolders: new Map(), childFiles: new Map(), hasMd: new Set(), allMd: [] };

function curFolder() { return folderStack[folderStack.length - 1]; }

async function fetchAllPages(q, fields) {
  let out = [], pageToken = "";
  do {
    const url = `${DRIVE}/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent("nextPageToken," + fields)}` +
      `&pageSize=1000${pageToken ? "&pageToken=" + pageToken : ""}&key=${API_KEY}`;
    const data = await (await api(url)).json();
    out = out.concat(data.files || []);
    pageToken = data.nextPageToken || "";
  } while (pageToken);
  return out;
}

async function buildIndex() {
  $("statusMsg").textContent = "드라이브 목록 읽는 중…";
  // 내 드라이브 루트의 실제 ID
  rootId = (await (await api(`${DRIVE}/files/root?fields=id&key=${API_KEY}`)).json()).id;

  const [folders, files] = await Promise.all([
    fetchAllPages("mimeType = 'application/vnd.google-apps.folder' and trashed = false and 'me' in owners",
                  "files(id,name,parents)"),
    fetchAllPages("name contains '.md' and trashed = false",
                  "files(id,name,parents,modifiedTime)"),
  ]);
  const mds = files.filter(f => f.name.toLowerCase().endsWith(".md"));

  idx.folders.clear(); idx.childFolders.clear(); idx.childFiles.clear(); idx.hasMd.clear();
  idx.allMd = mds;

  for (const fo of folders) idx.folders.set(fo.id, fo);
  const parentOf = id => {
    const f = idx.folders.get(id);
    return f && f.parents ? f.parents[0] : null;
  };
  const addChild = (map, pid, item) => {
    if (!map.has(pid)) map.set(pid, []);
    map.get(pid).push(item);
  };
  for (const fo of folders) addChild(idx.childFolders, (fo.parents || [rootId])[0], fo);
  for (const md of mds) {
    addChild(idx.childFiles, (md.parents || [rootId])[0], md);
    // md가 든 폴더와 그 모든 조상 폴더 표시
    let p = (md.parents || [])[0];
    let guard = 0;
    while (p && p !== rootId && guard++ < 50) {
      if (idx.hasMd.has(p)) break;
      idx.hasMd.add(p);
      p = parentOf(p);
    }
  }
}

function folderItems(fid) {
  const realId = fid === "root" ? rootId : fid;
  const subs = (idx.childFolders.get(realId) || [])
    .filter(fo => idx.hasMd.has(fo.id))                     // md 없는 폴더는 숨김
    .sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const files = (idx.childFiles.get(realId) || [])
    .slice().sort((a, b) => a.name.localeCompare(b.name, "ko"));
  return [...subs.map(f => ({ ...f, mimeType: "application/vnd.google-apps.folder" })), ...files];
}

function loadFolder() {
  $("searchBox").value = "";
  const items = folderItems(curFolder().id);
  allFiles = items;
  renderList(items, true);
  const nFiles = items.filter(f => f.mimeType !== "application/vnd.google-apps.folder").length;
  $("statusMsg").textContent = `${curFolder().name} — md 파일 ${nFiles}개`;
}

function scopeSet() {           // 시작 폴더 하위의 폴더 ID 집합 (내 드라이브 시작이면 null = 전체)
  if (folderStack[0].id === "root") return null;
  const set = new Set([folderStack[0].id]);
  const walk = id => (idx.childFolders.get(id) || []).forEach(f => { set.add(f.id); walk(f.id); });
  walk(folderStack[0].id);
  return set;
}

function searchAll(kw) {
  const low = kw.toLowerCase();
  const scope = scopeSet();
  const found = idx.allMd
    .filter(f => !scope || scope.has((f.parents || [])[0]))
    .filter(f => f.name.toLowerCase().includes(low))
    .sort((a, b) => (b.modifiedTime || "").localeCompare(a.modifiedTime || ""));
  renderList(found, false);
  $("statusMsg").textContent = `전체 검색: ${found.length}개`;
}

function renderList(items, folderMode) {
  const ul = $("fileList");
  ul.innerHTML = "";

  // 상위 폴더로 가기
  if (folderMode && folderStack.length > 1) {
    const up = document.createElement("li");
    up.innerHTML = `<div class="fname">‹ 상위 폴더</div><div class="fdate"></div>`;
    up.querySelector(".fdate").textContent = folderStack[folderStack.length - 2].name;
    up.onclick = () => { folderStack.pop(); loadFolder(); };
    ul.appendChild(up);
  }

  $("sideEmpty").style.display = items.length || folderStack.length > 1 ? "none" : "block";
  if (!items.length && accessToken) $("sideEmpty").innerHTML = "여기엔 폴더나 .md 파일이 없습니다.<br>＋ 버튼으로 새로 만들 수 있습니다.";

  for (const f of items) {
    const isFolder = f.mimeType === "application/vnd.google-apps.folder";
    const li = document.createElement("li");
    li.dataset.id = f.id;
    if (!isFolder && currentFile && f.id === currentFile.id) li.classList.add("active");
    if (isFolder) {
      li.innerHTML = `<div class="fname"></div>`;
      li.querySelector(".fname").textContent = "📁 " + f.name;
    } else {
      li.innerHTML = `<div class="fname"></div><div class="fdate"></div>`;
      li.querySelector(".fname").textContent = f.name.replace(/\.md$/i, "");
      li.querySelector(".fdate").textContent = new Date(f.modifiedTime).toLocaleString("ko-KR");
    }
    li.onclick = isFolder
      ? () => { folderStack.push({ id: f.id, name: f.name }); loadFolder(); }
      : () => openFile(f);
    ul.appendChild(li);
  }
}

/* ── 열기 / 저장 / 새 파일 ───────────────── */
async function openFile(f) {
  if (dirty && !confirm("저장하지 않은 변경사항이 있습니다. 다른 파일을 열까요?")) return;
  $("statusMsg").textContent = "파일 여는 중…";
  try {
    const r = await api(`${DRIVE}/files/${f.id}?alt=media`);
    editor.value = await r.text();
    currentFile = f;
    setDirty(false);
    $("fileTitle").textContent = f.name;
    $("docTitle").textContent = f.name.replace(/\.md$/i, "");
    $("saveBtn").disabled = false;
    $("previewBtn").disabled = false;
    $("delBtn").disabled = false;
    $("statusMsg").textContent = f.name + " 열림";
    updateCount();
    document.querySelectorAll("#fileList li").forEach(li =>
      li.classList.toggle("active", li.dataset.id === f.id));
    setSidebar(false);
    setMode("preview");
  } catch (e) {
    if (e.message !== "token expired") { console.error(e); toast("파일을 열지 못했습니다", "err"); }
  }
}

async function saveFile() {
  if (!currentFile || !accessToken) return;
  $("saveBtn").disabled = true;
  $("statusMsg").textContent = "저장 중…";
  try {
    await api(`${UPLOAD}/files/${currentFile.id}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "text/markdown; charset=UTF-8" },
      body: editor.value,
    });
    setDirty(false);
    $("statusMsg").textContent = currentFile.name + " 저장됨 " + new Date().toLocaleTimeString("ko-KR");
    toast("저장 완료", "ok");
  } catch (e) {
    if (e.message !== "token expired") { console.error(e); toast("저장 실패. 네트워크를 확인하세요.", "err"); }
  } finally {
    $("saveBtn").disabled = !currentFile;
  }
}

async function newFile() {
  let name = prompt(`새 파일 이름 (현재 폴더: ${curFolder().name})`);
  if (!name) return;
  if (!name.toLowerCase().endsWith(".md")) name += ".md";
  const meta = { name, mimeType: "text/markdown", parents: [curFolder().id === "root" ? rootId : curFolder().id] };
  const boundary = "-------md" + Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(meta) +
    `\r\n--${boundary}\r\nContent-Type: text/markdown; charset=UTF-8\r\n\r\n` +
    `# ${name.replace(/\.md$/i, "")}\n\n` +
    `\r\n--${boundary}--`;
  try {
    await api(`${UPLOAD}/files?uploadType=multipart`, {
      method: "POST",
      headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
      body,
    });
    toast("새 파일을 만들었습니다", "ok");
    await buildIndex(); loadFolder();
  } catch (e) {
    if (e.message !== "token expired") { console.error(e); toast("파일 생성 실패", "err"); }
  }
}

/* ── 편집 상태 / 미리보기 ─────────────────── */
function setDirty(v) {
  dirty = v;
  $("dirtyDot").style.display = v ? "inline" : "none";
}
function updateCount() {
  $("charCount").textContent = editor.value.length.toLocaleString() + "자";
}
function refreshPreview() {
  const p = $("preview");
  if (p.style.display !== "none" && window.marked)
    p.innerHTML = marked.parse(editor.value, { breaks: true, gfm: true });
}

editor.addEventListener("input", () => { setDirty(true); updateCount(); refreshPreview(); });

function setMode(mode) {          // "edit" | "preview"
  const p = $("preview");
  if (mode === "preview") {
    editor.style.display = "none";
    p.style.display = "block";
    $("previewBtn").textContent = "편집";
    refreshPreview();
  } else {
    p.style.display = "none";
    editor.style.display = "block";
    $("previewBtn").textContent = "미리보기";
    editor.focus();
  }
  // 편집 중 + 파일 열림 상태에서만 완료 버튼 표시
  $("fab").style.display = (mode === "edit" && currentFile) ? "block" : "none";
}

$("previewBtn").onclick = () =>
  setMode($("preview").style.display === "block" ? "edit" : "preview");

// 미리보기 더블클릭(더블탭) → 바로 편집 모드
$("preview").addEventListener("dblclick", () => setMode("edit"));

async function deleteFile() {
  if (!currentFile) return;
  if (!confirm(`"${currentFile.name}" 파일을 휴지통으로 보낼까요?`)) return;
  $("delBtn").disabled = true;
  try {
    await api(`${DRIVE}/files/${currentFile.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ trashed: true }),
    });
    toast("휴지통으로 이동했습니다 (드라이브에서 복구 가능)", "ok");
    currentFile = null; editor.value = ""; setDirty(false); updateCount();
    $("docTitle").textContent = "";
    $("fileTitle").textContent = "파일을 선택하세요";
    $("saveBtn").disabled = true; $("previewBtn").disabled = true;
    setMode("edit");
    await buildIndex(); loadFolder();
  } catch (e) {
    if (e.message !== "token expired") { console.error(e); toast("삭제에 실패했습니다", "err"); }
    $("delBtn").disabled = !currentFile;
  }
}

$("pinBtn").onclick = () => {
  const cf = curFolder();
  if (vaultRoot && vaultRoot.id === cf.id) {          // 해제
    vaultRoot = null;
    localStorage.removeItem("vaultRoot");
    folderStack = [{ id: "root", name: "내 드라이브" }];
    loadFolder();
    toast("고정 해제. 내 드라이브 전체를 표시합니다.", "ok");
  } else {                                            // 현재 폴더를 시작 폴더로
    if (cf.id === "root") { toast("하위 폴더에 들어간 뒤 고정하세요.", "err"); return; }
    vaultRoot = { id: cf.id, name: cf.name };
    localStorage.setItem("vaultRoot", JSON.stringify(vaultRoot));
    folderStack = [vaultRoot];
    loadFolder();
    toast(`"${cf.name}"을(를) 시작 폴더로 고정했습니다.`, "ok");
  }
};

$("delBtn").onclick = deleteFile;
$("saveBtn").onclick = saveFile;
$("newBtn").onclick = newFile;
$("authBtn").onclick = () => accessToken ? logout() : login();
$("loginBigBtn").onclick = login;
function setSidebar(open) {
  $("sidebar").classList.toggle("open", open);
  $("backdrop").classList.toggle("show", open);
}
$("sideToggle").onclick = () => setSidebar(!$("sidebar").classList.contains("open"));
$("backdrop").onclick = () => setSidebar(false);

let searchTimer = null;
$("searchBox").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const kw = e.target.value.trim();
  searchTimer = setTimeout(() => {
    if (!kw) loadFolder();
    else searchAll(kw);
  }, 150);
});

$("fab").onclick = () => setMode("preview");

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveFile(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "e") {
    e.preventDefault();
    if (currentFile) setMode($("preview").style.display === "block" ? "edit" : "preview");
  }
  if (e.key === "Escape" && currentFile && editor.style.display !== "none") setMode("preview");
});

window.addEventListener("beforeunload", e => {
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});

/* ── 토스트 ─────────────────────────────── */
let toastTimer = null;
function toast(msg, cls = "") {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show " + cls;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, 3000);
}
</script>
</body>
</html>
